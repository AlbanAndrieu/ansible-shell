[project]
name = "ansible-shell"
version = "1.0.0"
description = "Ansible role to install and configure shell (Ubuntu, macOS)"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "ansible-builder>=3.1.0",
  "ansible-core>=2.18.0",
  "ansible-lint>=25.8.2",
  "ansible-navigator>=25.8.0",
  "ansible-playbook-grapher>=2.10.0",
  "ansible-runner>=2.4.1",
  "molecule>=25.7.0",
  "molecule-plugins[docker]>=25.8.12",
  "pre-commit>=4.5.0",
  "pytest-testinfra>=10.2.2",
  "sqlfluff>=3.5.0",
  "yamllint>=1.37.1",
]

[tool.uv]
# Ansible role, not a Python package: only manage the virtualenv.
package = false
default-groups = ["dev"]

# Same rules as ~/.ruff.toml, so that CI and local runs agree
[tool.ruff.lint]
ignore = ["E501", "E203", "RUF012"]
select = ["B", "C", "E", "F", "W", "S", "A", "LOG", "RUF", "PLC", "PLE", "PLW", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest/testinfra checks are written with assert
"**/tests/*" = ["S101"]
