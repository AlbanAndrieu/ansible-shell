---
##################################
####### ENV PARAMETERS
##################################

shell_env_drive_path: "/cygdrive/c"
shell_env_database_arch: winnt
shell_env_maven_local_repo_path: "{{ shell_env_drive_path }}/repo"
shell_env_project_extraction: cpp

shell_env_java_version: "jdk1.7.0_05"
shell_env_java_major_version: "1.7"
shell_env_java_home: "${DRIVE_PATH}/SUN/SDK/{{ shell_env_java_version }}"
shell_env_python_dir: "${DRIVE_PATH}/Python{{ shell_env_python_major_version }}"
shell_env_python_exe: "{{ shell_env_python_dir }}/python"
shell_env_scons_dir: "${DRIVE_PATH}/scons"
shell_env_scons_path: "${SCONS_DIR}/scons-local-{{ shell_env_scons_major_version }}/SCons/Script"
shell_env_scons_exe: "{{ shell_env_scons_alias }}"
shell_env_scons_alias: "${SCONS_DIR}/scons.py"
shell_env_cmake_home: "${DRIVE_PATH}/CMake-{{ shell_env_cmake_major_version }}"
shell_env_m2_home: "${DRIVE_PATH}/apache-maven-{{ shell_env_maven_major_version }}"
shell_env_ant_home: "${DRIVE_PATH}/apache-ant-{{ shell_env_ant_major_version }}"
shell_env_diff_cmd: xxdiff
shell_env_qt_dir: "/lib/qt3"
shell_env_catalina_home: "${JBOSS_HOME}/server/default"
shell_env_eclipse_home: "${DRIVE_PATH}/eclipse-{{ shell_env_eclipse_version }}"
shell_env_md_home: "{{ shell_env_drive_path }}/MagicDraw-UML-16.5"

shell_env_tibco_home: "${DRIVE_PATH}/Tibco"
shell_env_tibrv_home: "${DRIVE_PATH}/Tibco/Tibrv"

##################################
####### USER PARAMETERS
##################################

shell_env_user_index_id: 24

shell_env_workstation: PTXMZ0087
# FORCE DISPLAY
shell_env_remote_workstation: "{{ shell_env_workstation }}:0.0"
shell_env_running_services_server: "{{ shell_env_workstation }}"
shell_env_unix_username: aandrieu

shell_env_editor: nedit

shell_env_log4j_root_category: "DEBUG, {{ shell_env_log4j_active_appender }}"
shell_env_logger_root_category: "DEBUG, CONSOLE, SOCKETSERV"
shell_env_app_server_mode: jboss

shell_env_jboss_home: "{{ shell_env_drive_path }}/jboss-{{ shell_env_jboss_version }}"
