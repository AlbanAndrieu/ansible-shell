---
##################################
####### ENV GLOBAL PARAMETERS
##################################

# homebrew_home_check_path: "/home/linuxbrew/.linuxbrew"
homebrew_home_check_path: "{{ lookup('env', 'HOME') }}/.linuxbrew"
# homebrew_check_path: "/usr/bin/brew"
# homebrew_check_path: "/usr/local/bin/brew"
homebrew_check_path: "{{ homebrew_home_check_path }}/bin/brew"

shell_env_dev_version: "{{ shell_default_version }}"

shell_env_dev_mode: 1
shell_env_default_env_loaded: 30

########

shell_env_drive_path: ""
shell_env_project_home: "${DRIVE_PATH}{{ shell_project_home }}"
shell_env_project_user: "{{ shell_env_unix_username }}"
shell_env_workspace_env: "${PROJECT_HOME}/${PROJECT_USER}${PROJECT_VERSION}/{{ shell_workspace_suffix }}"

shell_env_project_version: "{{ shell_env_dev_version }}"
shell_env_project_extraction: nabla-cpp
shell_env_project_build_type: target
shell_env_project_target_path: "${WORKSPACE}/${PROJECT_BUILD_TYPE}"

#################################

shell_env_eclipse_debug_port: "29{{ shell_env_user_index_id }}"
shell_env_debug_options:
  "-Xdebug -Xnoagent -Xrunjdwp:transport=dt_socket,address={{ shell_env_eclipse_debug_port }},server=y,suspend=n"

#################################

shell_env_editor: vi
shell_env_term: xterm
shell_env_cowsay:
# LANG: "fr_FR.UTF-8"
shell_env_lang: "en_US.UTF-8"
shell_env_pager: "most"
shell_env_histsize: "1000"

# DEFAULT_LOG_PATH: {{ shell_env_project_target_path }}/work/log

shell_env_log4j_active_appender: "CONSOLE, SOCKETSERV, FILE"
shell_env_log4j_root_category: "DEBUG, {{ shell_env_log4j_active_appender }}"
shell_env_log4j_server_name: "PROJECT"
shell_env_log4j_server_file: "/tmp/project.log"
shell_env_log4j_server_port: 4445
shell_env_log4j_server_host: localhost
# LOG4J_SERVER_PATTERN: {{ shell_env_log4j_server_name }} - #%d{ABSOLUTE} %5p %c{1}:%L - %m%n
shell_env_log4j_server_pattern: "{{ shell_env_log4j_server_name }} - %d{yyyy/MM/dd HH:mm:ss}  %-5p [%t] %c{2} - %m%n"

# MAVEN_LOCAL_REPO_PATH: ~/.m2/repository
# MAVEN_LOCAL_REPO_PATH: {{ shell_env_drive_path }}/repo
shell_env_maven_local_repo_path: "${WORKSPACE}/.m2/repository"
shell_env_maven_opts: "-Xms1G -Xmx2G -Dmaven.color.hide.level=false"
shell_env_java_opts: "-Xms1G -Xmx2G"
shell_env_java_home: "${DRIVE_PATH}/usr/lib/jvm/jdk{{ shell_env_java_major_version }}"
# setenv SCONS_DIR ${PYTHON_DIR}
# setenv SCONS_DIR ${PYTHON_DIR}/Lib/site-packages/scons-{{ shell_env_scons_major_version }}
shell_env_scons_dir: "${DRIVE_PATH}/usr/lib/scons"
shell_env_scons_path: "${SCONS_DIR}/script"
# SCONS_PATH: ${SCONS_DIR}/SCons/Script
shell_env_scons_exe: "${DRIVE_PATH/usr/bin/scons"
shell_env_scons_alias: "{{ shell_env_scons_exe }}"
shell_env_m2_home: "${DRIVE_PATH}/usr/share/maven3"
shell_env_eclipse_home: "${DRIVE_PATH}/usr/local/eclipse/eclipse-4"
shell_env_tibco_home: "${DRIVE_PATH}/home/{{ shell_env_unix_username }}/tibco"
shell_env_tibrv_home: "{{ shell_env_tibco_home }}/tibrv/{{ shell_env_tibrv_version }}"

shell_env_md_home: "${DRIVE_PATH}/MagicDraw-UML-16.5"
