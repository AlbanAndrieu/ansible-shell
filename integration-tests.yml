---
#
# integration-tests.yml
#

- name: Integration tests
  hosts: all
  become: true
  tasks:
    # Tests
    - name: Check git
      ansible.builtin.command: which git
      register: git_path
      changed_when: false
      failed_when: false
    - name: Display git path
      ansible.builtin.debug:
        msg: "Git was installed in {{ git_path.stdout }}"
    - name: Fail when git is missing
      ansible.builtin.fail:
        msg: "Git not found, tests failed."
      when: git_path.rc != 0
