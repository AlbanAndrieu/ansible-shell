---
# dependencies: []
dependencies:
  # git is provided by Xcode Command Line Tools or Homebrew on macOS
  - role: geerlingguy.git
    when: ansible_os_family != 'Darwin'

galaxy_info:
  author: Alban Andrieu
  description: Install and configure shell
  role_name: shell
  namespace: albanandrieu
  company: Nabla
  license: GPLv3
  # ansible-core version required by pyproject.toml
  min_ansible_version: "2.18"
  platforms:
    # Tested by Molecule (.github/workflows/ci.yml)
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: Debian
      versions:
        - all
    # Tested in check mode on macos-latest
    - name: MacOSX
      versions:
        - all
  galaxy_tags:
    - development
    - system
