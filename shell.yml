---
# Ubuntu: uv run ansible-playbook -i hosts -c local -v shell.yml --ask-become-pass | tee setup.log
# macOS:  uv run ansible-playbook -i hosts -c local --limit localhost --check --diff shell.yml (dry-run first)

- name: Assert platform is supported
  hosts: all
  remote_user: root
  gather_facts: true

  tasks:
    - name: Assert platform is supported
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat', 'CentOS', 'Windows', 'Solaris', 'Darwin']
          - ansible_architecture in ['x86_64', 'arm64', 'aarch64']

- name: Group hosts by distribution
  hosts: all
  gather_facts: true
  tasks:
    - name: Group hosts by distribution
      ansible.builtin.group_by:
        key: "{{ ansible_distribution }}-{{ ansible_distribution_version }}"

- name: Group hosts for supported distributions
  hosts: RedHat-7*:RedHat-6*:CentOS-7*:CentOS-6*:MacOSX-*:Ubuntu-26*:Ubuntu-25*:Ubuntu-24*:Ubuntu-23*:Ubuntu-22*:Ubuntu-21*:Ubuntu-20*:Ubuntu-19*:Ubuntu-18*:Ubuntu-17*:Ubuntu-16*:Ubuntu-15*:Ubuntu-14*:Ubuntu-13*:Ubuntu-12*
  gather_facts: false
  tasks:
    - name: Group hosts for supported distributions
      ansible.builtin.group_by:
        key: "supported"

- name: Fail for unsupported distributions
  hosts: "!supported"
  gather_facts: false
  tasks:
    - name: Fail for unsupported distribution
      ansible.builtin.fail:
        msg:
          "{{ ansible_distribution }} {{ ansible_distribution_version }} is not a supported OS for this role. Supported
          OSes include Red Hat Enterprise Linux 6/7, CentOS 6/7, macOS or Ubuntu 12.04 to 26.04"
    - name: Display distribution version
      ansible.builtin.debug:
        msg: "Version {{ ansible_distribution }} {{ ansible_distribution_version }} {{ ansible_architecture }}"

- name: Bootstrap shell onto server
  hosts: MacOSX-*:Ubuntu-26*:Ubuntu-25*:Ubuntu-24*:Ubuntu-23*:Ubuntu-22*:Ubuntu-21*:Ubuntu-20*:Ubuntu-19*:Ubuntu-18*:Ubuntu-17*:Ubuntu-16*:Ubuntu-14*:Ubuntu-13*:Ubuntu-12*
  remote_user: albandrieu
  # Homebrew refuses to run as root and files in $HOME must stay owned by the user on macOS
  become: "{{ ansible_os_family != 'Darwin' }}"

  roles:
    # "./" would resolve to ./roles/ (galaxy roles directory) instead of this role
    - role: "{{ playbook_dir }}"

  vars:
    shell_default_version: "30"
    shell_git_configure_enabled: true
    shell_git:
      # Additional properties: 'shell_git_machine, shell_git_login, shell_git_email, shell_git_password, shell_git_name, shell_git_path, shell_git_ssl'.
      #         - {
      #           shell_git_machine: '82.231.208.223',
      #           shell_git_login: 'AlbanAndrieu',
      #           shell_git_email: 'alban.andrieu@free.fr',
      #           shell_git_password: 'microsoft',
      #           shell_git_name: "Alban Andrieu",
      #           shell_git_path: '/usr/bin',
      #           shell_git_ssl: false,
      #           shell_git_meld_enabled: yes,
      #           shell_git_editor: "gedit"
      #           }
      - shell_git_machine: "github.com"
        shell_git_login: "AlbanAndrieu"
        shell_git_email: "alban.andrieu@free.fr"
        shell_git_maildomain: "free.fr"
        shell_git_path: "/usr/bin"
        shell_git_ssl: false
        shell_git_meld_enabled: true
        shell_git_signingkey: "B12DECD437E9E1C8"
        shell_git_editor: "nano"
    #      shell_rlogin_enabled: no
    shell_maven_enabled: false
    docker_files_enable: false
