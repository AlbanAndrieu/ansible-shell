---
# Ubuntu: uv run ansible-playbook -i hosts -c local -v shell.yml --ask-become-pass | tee setup.log
# macOS:  uv run ansible-playbook -i hosts -c local --limit localhost --check --diff shell.yml (dry-run first)

# Facts are gathered first, without become: the next play's become depends on ansible_os_family
- name: Assert platform is supported
  hosts: all
  gather_facts: true
  tasks:
    # The role handles Debian/Ubuntu (tested by Molecule) and macOS (tested in check mode)
    - name: Assert platform is supported
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'Darwin']
          - ansible_architecture in ['x86_64', 'arm64', 'aarch64']
        fail_msg:
          "{{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_architecture }}) is not supported"

- name: Bootstrap shell onto server
  hosts: all
  gather_facts: false
  # Connects as the current user, set ansible_user in the inventory for remote hosts
  # Homebrew refuses to run as root and files in $HOME must stay owned by the user on macOS
  become: "{{ ansible_os_family != 'Darwin' }}"

  roles:
    # "./" would resolve to ./roles/ (galaxy roles directory) instead of this role
    - role: "{{ playbook_dir }}"

  vars:
    shell_default_version: "30"
    shell_git_configure_enabled: true
    shell_git:
      # Additional properties: 'shell_git_machine, shell_git_login, shell_git_email, shell_git_password, shell_git_name, shell_git_path, shell_git_ssl'.
      #         - {
      #           shell_git_machine: '82.231.208.223',
      #           shell_git_login: 'AlbanAndrieu',
      #           shell_git_email: 'alban.andrieu@free.fr',
      #           shell_git_password: 'microsoft',
      #           shell_git_name: "Alban Andrieu",
      #           shell_git_path: '/usr/bin',
      #           shell_git_ssl: false,
      #           shell_git_meld_enabled: yes,
      #           shell_git_editor: "gedit"
      #           }
      - shell_git_machine: "github.com"
        shell_git_login: "AlbanAndrieu"
        shell_git_email: "alban.andrieu@free.fr"
        shell_git_maildomain: "free.fr"
        shell_git_path: "/usr/bin"
        shell_git_ssl: false
        shell_git_meld_enabled: true
        shell_git_signingkey: "B12DECD437E9E1C8"
        shell_git_editor: "nano"
    shell_maven_enabled: false
    docker_files_enable: false
