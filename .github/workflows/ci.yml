---
name: CI
"on":
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "30 5 * * 0"

defaults:
  run:
    working-directory: "alban.andrieu.workstation"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: "alban.andrieu.workstation"

      - name: Install tools with mise (python, uv).
        uses: jdx/mise-action@v5
        with:
          working_directory: "alban.andrieu.workstation"

      # ansible-lint needs the collections and the geerlingguy.git role
      - name: Install dependencies.
        run: mise run install

      - name: Lint code (yamllint, ansible-lint).
        run: mise run lint

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      # Report every distro instead of cancelling the others on the first failure
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu2404
            playbook: converge.yml
          - distro: ubuntu2204
            playbook: converge.yml

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: "alban.andrieu.workstation"

      - name: Install tools with mise (python, uv).
        uses: jdx/mise-action@v5
        with:
          working_directory: "alban.andrieu.workstation"

      - name: Install test dependencies.
        run: uv sync --frozen

      - name: Run Molecule tests.
        run: uv run molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.distro }}
          MOLECULE_PLAYBOOK: ${{ matrix.playbook }}

  macos:
    name: macOS (check mode)
    runs-on: macos-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: "alban.andrieu.workstation"

      - name: Install tools with mise (python, uv).
        uses: jdx/mise-action@v5
        with:
          working_directory: "alban.andrieu.workstation"

      - name: Install dependencies.
        run: mise run install

      - name: Dry-run the playbook on localhost.
        run: mise run check
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
