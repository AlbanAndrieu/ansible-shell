---
# This playbook contains common plays that will be run on all nodes.

- name: Shell | Install bash shell (Debian only)
  ansible.builtin.apt:
    name: [bash]
    state: present
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu')

- name: Shell | Create env directory
  ansible.builtin.file:
    path: "{{ shell_env_directory }}"
    state: directory
    mode: "0700"
    owner: "{{ shell_owner }}"

- name: Shell | Configure step-0-color.sh file
  ansible.builtin.copy:
    src: step-0-color.sh
    dest: "{{ home }}/step-0-color.sh"
    mode: "0755"
  tags: bash

- name: Shell | Configure step-1-os.sh file
  ansible.builtin.copy:
    src: step-1-os.sh
    dest: "{{ home }}/step-1-os.sh"
    mode: "0755"
  tags: bash

- name: Shell | Configure run-python.sh file
  ansible.builtin.copy:
    src: run-python.sh
    dest: "{{ home }}/run-python.sh"
    mode: "0755"
  tags: bash

- name: Shell | Configure run-ansible-setup.sh file
  ansible.builtin.copy:
    src: run-ansible-setup.sh
    dest: "{{ home }}/run-ansible-setup.sh"
    mode: "0755"
  tags: bash

- name: Shell | Configure run-ansible.sh file
  ansible.builtin.copy:
    src: run-ansible.sh
    dest: "{{ home }}/run-ansible.sh"
    mode: "0755"
  tags: bash

- name: Shell | Configure ansible-env.sh file
  ansible.builtin.copy:
    src: ansible-env.sh
    dest: "{{ home }}/ansible-env.sh"
    mode: "0755"
  tags: bash

- name: Shell | Configure docker-env.sh file
  ansible.builtin.copy:
    src: docker-env.sh
    dest: "{{ home }}/docker-env.sh"
    mode: "0755"
  tags: bash

- name: Shell | Configure dev.env.sh file
  ansible.builtin.template:
    src: dev.env.sh.j2
    dest: "{{ shell_env_directory }}/dev.env.sh"
    mode: "0644"
  tags: bash

- name: Shell | Configure .bash_profile file
  ansible.builtin.copy:
    src: .bash_profile
    dest: "{{ home }}/.bash_profile"
    mode: "0644"
    backup: true
  tags: bash

# TODO
# sudo chown -R albandri:docker .dbus/
# chmod 700 .config/

- name: Shell | Configure .login file
  ansible.builtin.copy:
    src: .login
    dest: "{{ home }}/.login"
    mode: "0644"
  tags: bash

- name: Shell | Create .config directory
  ansible.builtin.file:
    path: "{{ home }}/.config"
    state: directory
    mode: "0755"
  tags: bash

# See https://starship.rs/
- name: Shell | Configure starship file
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ home }}/.config/starship.toml"
    mode: "0644"
  tags: bash

- name: Brew | Install homebrew and packages
  ansible.builtin.import_tasks: brew.yml
  when: shell_brew_enabled
  tags: [brew]

- name: Shell | Install git prompt git-radar requirements
  ansible.builtin.apt:
    name:
      - build-essential
      - curl
      - git
      - m4
      - ruby
      - texinfo
      - libbz2-dev
      - libcurl4-openssl-dev
      - libexpat-dev
      - libncurses-dev
      - zlib1g-dev
    state: present
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and ansible_distribution_version not in
    ['12.04', '13.04', '14.04'] and shell_brew_enabled
  become: true

- name: Shell | Install git prompt git-radar homebrew requirements
  community.general.homebrew:
    name: [randomize-lines]
    state: present
    update_homebrew: true
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and ansible_distribution_version not in
    ['12.04', '13.04', '14.04'] and shell_brew_enabled
  become: true
  become_user: "{{ shell_owner }}"
  # Best effort: linuxbrew may not be usable on this host
  failed_when: false

- name: Shell | Clone git prompt git-radar
  ansible.builtin.git:
    repo: "{{ shell_git_radar_repository }}"
    dest: "{{ home }}/.git-radar"
    version: "{{ shell_git_radar_version }}"
    accept_hostkey: true
    update: false
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and ansible_distribution_version not in
    ['12.04', '13.04', '14.04'] and shell_brew_enabled and shell_git_radar_enabled
  become: true

- name: Shell | Install git prompt git-radar formula
  community.general.homebrew:
    name: [michaeldfallen/formula/git-radar]
    state: present
    update_homebrew: true
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and ansible_distribution_version not in
    ['12.04', '13.04', '14.04'] and shell_brew_enabled and shell_git_radar_enabled
  become: true
  become_user: "{{ shell_owner }}"
  # Best effort: linuxbrew may not be usable on this host
  failed_when: false

- name: Shell | Install bash completion
  ansible.builtin.apt:
    name: [bash-completion]
    state: present
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_bash_completion_enabled

- name: Shell | Configure .bash_completion file
  ansible.builtin.copy:
    src: .bash_completion
    dest: "{{ home }}/.bash_completion"
    mode: "0644"
  when: shell_bash_completion_enabled and shell_bash_completion_extra_enabled
  tags: bash

- name: Shell | Generate pip completion
  ansible.builtin.command: pip completion --bash
  register: shell_pip_completion
  changed_when: false
  check_mode: false
  when: shell_bash_completion_enabled and shell_bash_completion_extra_enabled
  tags: bash

- name: Shell | Configure pip completion file
  ansible.builtin.copy:
    content: "{{ shell_pip_completion.stdout }}\n"
    dest: "{{ shell_bash_completion_dir }}/pip"
    mode: "0644"
  when: shell_bash_completion_enabled and shell_bash_completion_extra_enabled
  become: "{{ ansible_os_family != 'Darwin' }}"
  tags: bash

- name: Shell | Install kubectl tools
  community.general.snap:
    name: kubectl
    classic: true
  become: true
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and ansible_distribution_version is
    version_compare(19.04, '>=') and shell_bash_completion_kubectl_enabled
  tags: package

- name: Shell | Generate kubernetes completion
  ansible.builtin.command: kubectl completion bash
  register: shell_kubectl_completion
  changed_when: false
  check_mode: false
  when: shell_bash_completion_enabled and shell_bash_completion_kubectl_enabled
  tags: bash

- name: Shell | Configure kubernetes completion file
  ansible.builtin.copy:
    content: "{{ shell_kubectl_completion.stdout }}\n"
    dest: "{{ shell_bash_completion_dir }}/kubectl"
    mode: "0644"
  when: shell_bash_completion_enabled and shell_bash_completion_kubectl_enabled
  become: "{{ ansible_os_family != 'Darwin' }}"
  tags: bash

- name: Shell | Fix kubernetes ownership $HOME/.kube/
  ansible.builtin.file:
    path: "{{ shell_owner_home }}/.kube/"
    owner: "{{ shell_owner }}"
    group: "{{ shell_group }}"
    recurse: true
  become: "{{ ansible_os_family != 'Darwin' }}"

- name: Shell | Install bash completions
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/etc/bash_completion.d/{{ item.dest }}"
    mode: "0644"
  loop:
    "{{ shell_bash_completion_urls + (shell_docker_machine_completion_urls if shell_docker_machine_prompt_enabled else
    []) }}"
  loop_control:
    label: "{{ item.dest }}"
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_bash_completion_enabled
  become: true

- name: Shell | Install scons bash completion
  ansible.builtin.copy:
    src: scons_completion
    dest: /etc/bash_completion.d/scons_completion
    mode: "0644"
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_bash_completion_enabled

- name: Git | Install git prompt
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/git/git/master/contrib/completion/git-prompt.sh
    dest: "{{ home }}/.git-prompt.sh"
    mode: "0644"
  tags: git

- name: Shell | Configure .bashrc file
  ansible.builtin.template:
    src: .bashrc.j2
    dest: "{{ home }}/.bashrc"
    mode: "0644"
    backup: true
  when: not shell_cygwin_enabled
  tags: bash

- name: Shell | Copy the .novarc script for openstack
  ansible.builtin.template:
    src: .novarc.j2
    dest: "{{ home }}/.novarc"
    mode: "0600"
    owner: "{{ shell_owner }}"
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_novarc_enabled
  tags:
    - openstack
    - novarc

- name: Newrelic | Configure newrelic.yml file
  # newrelic_license_key is a secret: provide it from the inventory / vault
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_nano_enabled and not
    shell_cygwin_enabled and newrelic_license_key is defined
  ansible.builtin.template:
    src: newrelic.yml.j2
    dest: "{{ home }}/newrelic.yml"
    owner: "{{ shell_owner }}"
    mode: "0600"
  tags: newrelic

- name: Git | Configure git meld diff
  ansible.builtin.copy:
    src: git-diff.sh
    dest: "{{ shell_git_meld_directory }}/git-diff.sh"
    owner: "{{ shell_owner }}"
    group: "{{ shell_group }}"
    mode: "0755"
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_git_meld_enabled
  become: true
  tags: git

- name: Git | Copy the .netrc script for git credentials
  ansible.builtin.template:
    src: .netrc.j2
    dest: "{{ home }}/.netrc"
    mode: "0600"
    owner: "{{ shell_owner }}"
  when: shell_git_netrc_enabled
  tags: git

- name: Git | Configure git
  ansible.builtin.template:
    src: .gitconfig.j2
    dest: "{{ home }}/.gitconfig"
    owner: "{{ shell_owner }}"
    mode: "0600"
    backup: true
  # The template renders one section per shell_git entry: an empty list would wipe ~/.gitconfig
  when: shell_git_configure_enabled and shell_git | length > 0
  tags: git

- name: Git | Configure global git settings
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: maven-scm.maildomain, value: "{{ shell_git_maven_scm_maildomain }}" }
    - { name: maven-scm.forceUsername, value: "true" }
    - { name: alias.ci, value: commit }
    - { name: alias.st, value: status }
    - { name: color.ui, value: auto }
  # Already set by .gitconfig.j2, which would be overwritten back and forth otherwise
  when: not shell_git_configure_enabled or shell_git | length == 0
  tags: git

# See https://docs.ansible.com/ansible/git_config_module.html
- name: Git | Read all values from git config
  community.general.git_config_info:
    scope: global

- name: Vim | Copy the vim code from repository
  ansible.builtin.git:
    repo: "{{ shell_vim_color_repository }}"
    dest: "{{ home }}/.vim"
    version: "{{ shell_vim_color_version }}"
    accept_hostkey: true
    update: false
    # Submodules are fetched by vim-configure.sh, which rewrites their git:// URLs
    recursive: false
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_vim_enabled
  tags: vim

- name: Vim | Configure vim-configure.sh file
  ansible.builtin.template:
    src: vim-configure.sh.j2
    dest: "{{ shell_dir_tmp }}/vim-configure.sh"
    owner: "{{ shell_owner }}"
    mode: "0755"
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_vim_enabled
  tags: vim

- name: Vim | Update  ~/.vim
  ansible.builtin.command: "{{ shell_dir_tmp }}/vim-configure.sh"
  register: shell_vim_configure
  # git submodule update prints the submodules it checked out
  changed_when: "'checked out' in shell_vim_configure.stdout"
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_vim_enabled
  tags: vim
  become: true

- name: Nano | Copy the nano code from repository
  ansible.builtin.git:
    repo: "{{ shell_nano_color_repository }}"
    dest: "{{ home }}/nanorc"
    version: "{{ shell_nano_color_version }}"
    accept_hostkey: true
    update: false
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_nano_enabled
  tags: nano
  become: true

- name: Nano | Configure nano-configure.sh file
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_nano_enabled and not
    shell_cygwin_enabled
  ansible.builtin.template:
    src: nano-configure.sh.j2
    dest: "{{ shell_dir_tmp }}/nano-configure.sh"
    owner: "{{ shell_owner }}"
    mode: "0755"
  tags: nano

- name: Nano | Update  ~/.nanorc
  ansible.builtin.command: "{{ shell_dir_tmp }}/nano-configure.sh"
  args:
    chdir: "{{ home }}"
    creates: "{{ home }}/.nanorc"
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_nano_enabled
  become: true
  tags: nano

- name: Inputrc | Configure inputrc-configure.sh file
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_history_enabled and not
    shell_cygwin_enabled
  ansible.builtin.template:
    src: inputrc-configure.sh.j2
    dest: "{{ shell_dir_tmp }}/inputrc-configure.sh"
    owner: "{{ shell_owner }}"
    mode: "0755"
  tags: history

- name: Inputrc | Update  ~/.inputrc
  ansible.builtin.shell: "{{ shell_dir_tmp }}/inputrc-configure.sh > {{ home }}/.inputrc"
  args:
    creates: "{{ home }}/.inputrc"
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_history_enabled
  tags: history

- name: Maven | Configure maven-configure.sh file
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_maven_enabled
  ansible.builtin.template:
    src: maven-configure.sh.j2
    dest: "{{ shell_dir_tmp }}/maven-configure.sh"
    owner: "{{ shell_owner }}"
    mode: "0755"
  become: true
  tags: maven

- name: Locate | Install locate search tools
  ansible.builtin.apt:
    name: [locate]
    state: present
    update_cache: true
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_locate_enabled
  tags: package
  become: true

- name: Locate | Update locate database
  ansible.builtin.command: updatedb
  # Refreshes the index only, no configuration is changed
  changed_when: false
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_locate_enabled
  tags: locate
  become: true

- name: Synapse | Install synapse search tools
  ansible.builtin.apt:
    name: [synapse]
    state: present
    update_cache: true
  become: true
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_synapse_enabled and not
    shell_cygwin_enabled
  tags: package

- name: Synapse | Create synapse directory
  ansible.builtin.file:
    path: "{{ shell_synapse_directory }}"
    state: directory
    mode: "0700"
    owner: "{{ shell_owner }}"
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_synapse_enabled and not
    shell_cygwin_enabled

- name: Synapse | Copy synapse startpage search into place
  ansible.builtin.copy:
    src: startpage.xml
    dest: "{{ shell_synapse_directory }}"
    owner: "{{ shell_owner }}"
    group: "{{ shell_group }}"
    mode: "0644"
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_synapse_enabled and not
    shell_cygwin_enabled
  tags: synapse

- name: Synapse | Configure synapse config.json file
  when:
    (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and shell_synapse_enabled and not
    shell_cygwin_enabled
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ shell_synapse_directory }}/config.json"
    owner: "{{ shell_owner }}"
    group: "{{ shell_group }}"
    mode: "0644"
  tags: synapse

- name: Banner | Configure banner welcome file
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and not shell_cygwin_enabled
  ansible.builtin.copy:
    src: 11-welcome
    dest: /etc/update-motd.d/11-welcome
    owner: root
    group: root
    mode: "0755"
  tags: banner
