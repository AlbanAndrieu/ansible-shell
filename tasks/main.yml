---
# This playbook contains common plays that will be run on all nodes.

- name: Include OS-specific default variables.
  # include_vars: "{{ ansible_os_family }}.yml"
  ansible.builtin.include_vars: default.yml

- name: Include OS-specific version variables.
  ansible.builtin.include_vars: version.yml

- name: Include OS-specific custom variables.
  ansible.builtin.include_vars: custom-{{ ansible_distribution }}.yml

- name: Check Xcode Command Line Tools are installed (macOS)
  ansible.builtin.command: xcode-select -p
  register: shell_xcode_select
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_os_family == 'Darwin'

- name: Fail if Xcode Command Line Tools are missing (macOS)
  ansible.builtin.fail:
    msg: "Xcode Command Line Tools are missing, run: xcode-select --install"
  when: ansible_os_family == 'Darwin' and shell_xcode_select.rc != 0

- name: Configure shell
  ansible.builtin.import_tasks: shell.yml
  when: shell_enabled
  tags: [shell]

- name: Configure bash
  ansible.builtin.import_tasks: bash.yml
  when: shell_bash_enabled
  tags: [bash]

- name: Configure csh
  ansible.builtin.import_tasks: csh.yml
  when: shell_csh_enabled
  tags: [csh]

- name: Configure ksh
  ansible.builtin.import_tasks: ksh.yml
  when: shell_ksh_enabled
  tags: [ksh]

# Tasks run with become on Linux: give back to the user only the files this role writes in home
- name: Check files managed in home folder
  ansible.builtin.stat:
    path: "{{ home }}/{{ item }}"
  loop: "{{ shell_home_owned_paths }}"
  register: shell_home_owned_stat
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu')

- name: Fix ownership of files managed in home folder
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: "{{ 'directory' if item.stat.isdir else 'file' }}"
    recurse: "{{ item.stat.isdir }}"
    owner: "{{ shell_owner }}"
    group: "{{ shell_group }}"
  loop: "{{ shell_home_owned_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat is defined and item.stat.exists
  become: true
