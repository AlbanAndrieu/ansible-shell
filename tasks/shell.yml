---
# This playbook contains common plays that will be run on all nodes.

- name: Shell | Display current shell
  ansible.builtin.debug:
    msg: "SHELL is {{ ansible_env.SHELL | default('unset') }} "

- name: Shell | Check user
  ansible.builtin.user:
    name: "{{ shell_owner }}"
    state: present
  # user module needs root on macOS (dscl)
  when: ansible_os_family != 'Darwin'

- name: Shell | Check user home directory
  ansible.builtin.stat:
    path: "{{ shell_owner_home }}"
  register: home_present

- name: Shell | Display home directory status
  ansible.builtin.debug:
    msg: " shell | Path exists and is a directory"
  when: home_present.stat.isdir is defined and home_present.stat.isdir

- name: Shell | Configure log4j.lcf file
  ansible.builtin.template:
    src: log4j.lcf.j2
    dest: "{{ home }}/log4j.lcf"
    mode: "0644"
  when: shell_log4j_enabled
  tags: log4j

- name: Shell | Configure log4j.properties file
  ansible.builtin.template:
    src: log4j.properties.j2
    dest: "{{ home }}/log4j.properties"
    mode: "0644"
  when: shell_log4j_enabled
  tags: log4j

- name: Shell | Configure log4j.xml file
  ansible.builtin.template:
    src: log4j.xml.j2
    dest: "{{ home }}/log4j.xml"
    mode: "0644"
  when: shell_log4j_enabled
  tags: log4j

# rlogin/rsh support was removed (unencrypted, use ssh): clean up hosts set up by older versions
- name: Shell | Uninstall xinetd for rlogin rsh rexec
  ansible.builtin.apt:
    name: [xinetd]
    state: absent
    purge: true
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu')
  tags: package

- name: Shell | Remove rlogin trusted hosts (rhosts)
  ansible.builtin.file:
    path: "{{ home }}/.rhosts"
    state: absent
  tags: package

# Was only deployed on Linux, where the role runs with become
- name: Shell | Remove rlogin trusted hosts (hosts.equiv)
  ansible.builtin.file:
    path: /etc/hosts.equiv
    state: absent
  when: ansible_os_family != 'Darwin'
  tags: package

- name: Shell | Create gnupg directory
  ansible.builtin.file:
    path: "{{ home }}/.gnupg"
    state: directory
    owner: "{{ shell_owner }}"
    group: "{{ shell_group }}"
    mode: "0700"
  when: shell_gpg_enabled
  tags: gpg

- name: Shell | Configure gpg-agent.conf (gpg) file
  ansible.builtin.copy:
    src: gpg-agent.conf
    dest: "{{ home }}/.gnupg/gpg-agent.conf"
    owner: "{{ shell_owner }}"
    group: "{{ shell_group }}"
    mode: "0644"
  when: shell_gpg_enabled
  tags: gpg

- name: Shell | Create ssh directory
  ansible.builtin.file:
    path: "{{ home }}/.ssh"
    state: directory
    mode: "0700"
  when: shell_ssh_enabled
  tags: ssh

- name: Shell | Configure config (ssh) file
  ansible.builtin.template:
    src: config.j2
    dest: "{{ home }}/.ssh/config"
    mode: "0600"
    backup: true
  when: shell_ssh_enabled
  tags: ssh
