---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
driver:
  name: docker
platforms:
  # MOLECULE_DISTRO is set by the CI matrix, see .github/workflows/ci.yml
  - name: instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # The role runs as root in the container, not as the controller user
        user: root
        home: /root
        # Homebrew refuses to run as root and snapd is not available in containers
        shell_brew_enabled: false
        shell_bash_completion_kubectl_enabled: false
verifier:
  name: testinfra
